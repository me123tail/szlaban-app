publishing:
  email:
    recipients:
      - me123tail@wp.pl

workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: szlaban
    scripts:
      - name: Build Android Release APK
        script: |
          # Automatyczne szukanie pliku gradlew w projekcie
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "BŁĄD: Nie znaleziono pliku gradlew nigdzie w projekcie!"
            exit 1
          fi
          
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          echo "Znaleziono gradlew w: $GRADLEW_DIR. Wchodzę tam..."
          cd "$GRADLEW_DIR"
          
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
