publishing:
  email:
    recipients:
      - me123tail@wp.pl

workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: szlaban
    scripts:
      - name: Build Android Release APK
        script: |
          # 1. Wejdź do katalogu głównego kodu Androida (tam gdzie jest build.gradle.kts)
          if [ -d "app" ]; then
            cd app
          fi
          
          echo "Aktualna ścieżka: $(pwd)"
          echo "Zawartość katalogu:"
          ls -la
          
          # 2. Zainstaluj Gradle za pomocą Homebrew (wbudowanego w maszyny macOS Codemagic)
          echo "Instaluję Gradle w chmurze..."
          brew install gradle
          
          # 3. Uruchom kompilację za pomocą świeżo zainstalowanego globalnego Gradle
          echo "Uruchamiam kompilację APK..."
          gradle assembleRelease
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
