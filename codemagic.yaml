publishing:
  email:
    recipients:
      - me123tail@wp.pl

workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: szlaban
    scripts:
      - name: Build Android Release APK
        script: |
          # 1. Tworzenie wymaganego pliku .env.example w katalogu głównym
          echo "Tworzę plik .env.example..."
          touch .env.example
          
          # 2. Generowanie wrappera dokładnie w katalogu roboczym (szlaban)
          echo "Generuję pliki uruchomieniowe gradlew..."
          gradle wrapper
          
          # 3. Nadanie uprawnień do uruchomienia pliku
          chmod +x gradlew
          
          # 4. Sprawdzenie struktury – jeśli pliki są w podfolderze 'app', budujemy z parametrem -p
          if [ -d "app" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Wykryto konfigurację w podfolderze 'app'. Uruchamiam kompilację..."
            ./gradlew -p app assembleRelease
          else
            echo "Uruchamiam standardową kompilację..."
            ./gradlew assembleRelease
          fi
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
